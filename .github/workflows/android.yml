# Builds and checks every push and pull request:
#   1. unit tests and lint
#   2. the Play bundle (translation as an on-demand module)
#   3. the sideload APKs (one per CPU type plus universal, translation built in)
#   4. an APK size report with a budget, so a dependency that silently adds megabytes fails the build
name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The free private-repo runner has ~7 GB RAM; the default 4 GB Gradle + 4 GB test heaps got the runner killed mid-build.
env:
  CI_GRADLE: >-
    --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
    -Pkotlin.compiler.execution.strategy=in-process -Pscanpro.testHeap=2560m

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests, lint and Play bundle
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:bundleRelease $CI_GRADLE

      - name: Sideload APKs
        run: ./gradlew -Pscanpro.sideload=true :app:assembleRelease $CI_GRADLE

      - name: Size report
        run: scripts/ci/size-report.sh app/build/outputs/apk/release app/build/outputs/bundle/release >> "$GITHUB_STEP_SUMMARY"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Build outputs
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
