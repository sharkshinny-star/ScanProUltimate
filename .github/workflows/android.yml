# Android CI, one job so a push uses as few runner minutes as possible: Room schema check, unit tests and lint, the Play
# bundle (translation as an on-demand module), the sideload APKs (one per CPU type plus universal, translation built in)
# and an APK size report with a budget, so a dependency that silently adds megabytes fails the build.
# The repository is public, so standard runners are free and unlimited: every push to main or the working branch, every
# pull request to main and every manual run does the full build. Docs-only changes are still skipped.
# Artifacts are uploaded only on a manual run; test reports only when a run fails; both are kept 3 days.

name: Android CI

on:
  push:
    branches: [main, claude/awesome-clarke-ussjo3]
    paths-ignore: ['**.md', 'docs/**', 'supabase/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'supabase/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The free private-repo runner has ~7 GB RAM; the default 4 GB Gradle + 4 GB test heaps got the runner killed mid-build.
env:
  CI_GRADLE: >-
    --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
    -Pkotlin.compiler.execution.strategy=in-process -Pscanpro.testHeap=2560m
    --warning-mode=all

jobs:
  build:
    # Kill switch: set the repository variable CI_PAUSED to true (Settings > Secrets and variables > Actions >
    # Variables) to stop all runs for the rest of the month without editing files.
    if: vars.CI_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Seconds, before the Gradle build: strings complete in all six languages, no broad permissions, tool search.
      - name: Source audit (translations, permissions, tool search)
        run: python3 -I scripts/ci/scanpro-quality-audit.py

      - name: Room schema files match the database version
        run: bash scripts/ci/check-room-schema.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # main and the working branch save the Gradle cache; PRs just read it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Write the cache from the working branch too, so the Gradle distribution and dependencies are not
          # downloaded on every run (the branch is the only one that builds; main never does).
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/awesome-clarke-ussjo3' }}

      - run: chmod +x ./gradlew

      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug $CI_GRADLE

      - name: Play bundle
        run: ./gradlew :app:bundleRelease $CI_GRADLE

      # The build re-exports the Room schema; a difference from the committed files means a table changed without
      # a version bump, or the new version's file was not committed.
      - name: Exported Room schemas are committed
        run: bash scripts/ci/check-room-schema.sh --after-build

      - name: Sideload APKs
        run: ./gradlew -Pscanpro.sideload=true :app:assembleRelease $CI_GRADLE

      - name: Size report
        run: scripts/ci/size-report.sh app/build/outputs/apk/release app/build/outputs/bundle/release >> "$GITHUB_STEP_SUMMARY"

      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Build outputs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-outputs
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
