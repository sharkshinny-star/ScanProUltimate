# Supabase deploy (migrations + edge functions).
# ONLY for repos that have a supabase/ folder. Repos without Supabase must not have this file.
#
# Repo secrets needed (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    database password of the project
#   SUPABASE_PROJECT_ID     project ref (the id in the project URL)

name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**']   # runs only when Supabase files change
  workflow_dispatch:

# Never cancel a deploy halfway: a half-applied migration can break the database.
# A newer push waits for the running deploy to finish instead.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        if: hashFiles('supabase/migrations/**') != ''
        run: supabase db push --yes

      - name: Deploy edge functions
        if: hashFiles('supabase/functions/**') != ''
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
